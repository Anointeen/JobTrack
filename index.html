    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrack | Career Management Platform & Job Tracker</title>
    <meta name="description" content="Track every application, stay organized, monitor your progress, and manage your career journey from one powerful platform." />
    <!-- Anti-Flash Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('jobtrack_theme');
          var theme = saved || 'system';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') document.documentElement.classList.add('dark-theme');
        } catch (e) {}
      })();
    </script>
    <!-- Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
